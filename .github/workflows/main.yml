name: Build Modern ArmorPaint Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository with Deep Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Node.js Build Tooling
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Modern MSBuild Compiler
      uses: microsoft/setup-msbuild@v2

    - name: Run Native C Project Generator
      working-directory: paint
      shell: cmd
      run: |
        ..\base\make

    - name: Verify Modern Solution Structures
      working-directory: paint
      shell: cmd
      run: |
        if exist "build\armorpaint.slnx" (
            echo "SUCCESS: Found modern .slnx configuration."
        ) else if exist "build\ArmorPaint.sln" (
            echo "SUCCESS: Found legacy .sln configuration."
        ) else (
            echo "CRITICAL FAILURE: No engine solution files were found inside paint\build\"
            dir build
            exit 1
        )

    - name: Compile ArmorPaint App Binary
      working-directory: paint
      shell: cmd
      run: |
        if exist "build\armorpaint.slnx" (
            msbuild build\armorpaint.slnx /p:Configuration=Release /p:Platform=x64
        ) else (
            msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64
        )

    - name: Gather Assets and Export App Bundle
      shell: powershell
      run: |
        # Assembles the portable production bundle
        New-Item -ItemType Directory -Force -Path "./ArmorPaint-Package"
        
        # Check and capture modern vs fallback binary placement directories
        if (Test-Path "paint/build/out") {
            Copy-Item -Path "paint/build/out/*" -Destination "./ArmorPaint-Package" -Recurse -ErrorAction SilentlyContinue
        }
        if (Test-Path "paint/build/Release") {
            Copy-Item -Path "paint/build/Release/*" -Destination "./ArmorPaint-Package" -Recurse -ErrorAction SilentlyContinue
        }
        if (Test-Path "paint/build/x64/Release") {
            Copy-Item -Path "paint/build/x64/Release/*" -Destination "./ArmorPaint-Package" -Recurse -ErrorAction SilentlyContinue
        }
        
        # Bring over required companion application asset folders
        if (Test-Path "paint/assets") {
            Copy-Item -Path "paint/assets" -Destination "./ArmorPaint-Package/assets" -Recurse
        }

    - name: Upload Compiled Portable Binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-Portable
        path: ArmorPaint-Package/
