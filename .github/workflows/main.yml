name: Build Modern ArmorPaint 1.0 Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository with Deep Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Inject Clang and Graphics Compiler Tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Modern MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Run Modern ArmorPaint Project Generator
      working-directory: paint
      shell: cmd
      run: |
        ..\base\make

    - name: Compile Application via MSBuild
      working-directory: paint
      shell: cmd
      run: |
        if exist "build\armorpaint.slnx" (
            msbuild build\armorpaint.slnx /p:Configuration=Release /p:Platform=x64
        ) else (
            msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64
        )

    - name: Exhaustive Binary Gathering and Packaging
      shell: powershell
      run: |
        # Creates a fresh package folder
        New-Item -ItemType Directory -Force -Path "./ArmorPaint-Package"
        
        # Exhaustively scans all known Visual Studio output destinations for the exe
        Write-Output "Gathering compiled files..."
        Get-ChildItem -Path "paint/build" -Filter "*.exe" -Recurse | ForEach-Object {
            Write-Output "Found executable at: $($_.FullName)"
            Copy-Item -Path $_.FullName -Destination "./ArmorPaint-Package" -Force
        }
        
        # Pulls companion dll configurations from the release directory
        if (Test-Path "paint/build/x64/Release") {
            Copy-Item -Path "paint/build/x64/Release/*.dll" -Destination "./ArmorPaint-Package" -ErrorAction SilentlyContinue
        }
        if (Test-Path "paint/build/out") {
            Copy-Item -Path "paint/build/out/*" -Destination "./ArmorPaint-Package" -Recurse -ErrorAction SilentlyContinue
        }
        
        # Copies the vital engine graphic assets alongside the app
        if (Test-Path "paint/assets") {
            Copy-Item -Path "paint/assets" -Destination "./ArmorPaint-Package/assets" -Recurse
        }
        
        # Quick check to ensure the folder isn't empty
        if (-not (Test-Path "./ArmorPaint-Package/*.exe")) {
            Write-Error "CRITICAL: No executable file found during the scanning process."
            exit 1
        }

    - name: Upload Complete ArmorPaint Executable
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64-Portable
        path: ArmorPaint-Package/
