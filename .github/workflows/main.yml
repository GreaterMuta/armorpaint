name: Build ArmorPaint Standalone Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup MSBuild Compiler Toolchain
      uses: microsoft/setup-msbuild@v2

    - name: Extract Hidden V8 Engine Monolith
      shell: powershell
      run: |
        # Locates and extracts the massive v8 file required by the graphics framework
        $v8Path = "armorcore/v8/libraries/win32/release"
        if (Test-Path "$v8Path/v8_monolith.7z") {
            Write-Output "Found older structure V8 archive. Extracting..."
            7z x "$v8Path/v8_monolith.7z" -o"$v8Path" -y
        } else {
            Write-Output "Checking alternative paths for V8..."
            Get-ChildItem -Path . -Filter "v8_monolith.7z" -Recurse | ForEach-Object {
                Write-Output "Extracting found archive: $($_.FullName)"
                7z x $_.FullName -o"$($_.DirectoryName)" -y
            }
        }

    - name: Run ArmorPaint Project Generator
      working-directory: paint
      shell: cmd
      run: |
        ..\base\make

    - name: Verify Solution File Generation
      working-directory: paint
      shell: cmd
      run: |
        if not exist "build\ArmorPaint.sln" (
          echo "CRITICAL ERROR: ArmorPaint.sln was not generated by the make engine."
          exit 1
        )

    - name: Compile ArmorPaint Project to Binary
      working-directory: paint
      shell: cmd
      run: |
        msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

    - name: Bundle and Package Executable
      shell: powershell
      run: |
        # Creates a unified portable app directory
        New-Item -ItemType Directory -Force -Path "./ArmorPaint-App"
        Copy-Item -Path "paint/build/Release/*" -Destination "./ArmorPaint-App" -Recurse -ErrorAction SilentlyContinue
        # ArmorPaint needs its assets folder alongside the binary to launch correctly
        if (Test-Path "paint/assets") {
            Copy-Item -Path "paint/assets" -Destination "./ArmorPaint-App/assets" -Recurse
        }

    - name: Upload Finished ArmorPaint App
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64-Standalone
        path: ArmorPaint-App/
