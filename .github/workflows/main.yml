name: Build Modern ArmorPaint 1.0 Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository with Deep Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Inject Clang and Graphics Compiler Tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Modern MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Run Modern ArmorPaint Project Generator
      working-directory: paint
      shell: cmd
      run: |
        ..\base\make

    - name: Dynamic Solution Build Verification
      working-directory: paint
      shell: cmd
      run: |
        if exist "build\armorpaint.slnx" (
            echo "SUCCESS: Found modern .slnx configuration."
        ) else if exist "build\ArmorPaint.sln" (
            echo "SUCCESS: Found legacy .sln configuration."
        ) else (
            echo "CRITICAL FAILURE: No engine build configurations were generated by amake."
            dir build
            exit 1
        )

    - name: Compile Application via MSBuild
      working-directory: paint
      shell: cmd
      run: |
        if exist "build\armorpaint.slnx" (
            msbuild build\armorpaint.slnx /p:Configuration=Release /p:Platform=x64
        ) else (
            msbuild build\ArmorPaint.sln /p:Configuration=Release /p:Platform=x64
        )

    - name: Assemble Standalone Portable Bundle
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "./ArmorPaint-App"
        
        # Capture and merge binary output paths based on latest structural shifts
        if (Test-Path "paint/build/out") {
            Copy-Item -Path "paint/build/out/*" -Destination "./ArmorPaint-App" -Recurse -ErrorAction SilentlyContinue
        }
        if (Test-Path "paint/build/Release") {
            Copy-Item -Path "paint/build/Release/*" -Destination "./ArmorPaint-App" -Recurse -ErrorAction SilentlyContinue
        }
        
        # Ensure mandatory companion assets copy over alongside the compiled executable
        if (Test-Path "paint/assets") {
            Copy-Item -Path "paint/assets" -Destination "./ArmorPaint-App/assets" -Recurse
        }

    - name: Upload Complete ArmorPaint Executable
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-x64-Portable
        path: ArmorPaint-App/
